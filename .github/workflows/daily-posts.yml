name: 블로그 초안 만들기

on:
  workflow_dispatch: # Actions 탭에서 'Run workflow' 버튼으로 실행
    inputs:
      topics:
        description: "글 주제 (쉼표로 구분). 예: 다이소 수납템 추천, 환절기 비염 관리법"
        required: true

permissions:
  contents: write

concurrency:
  group: blog-posts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 초안 작성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPICS: ${{ inputs.topics }}
          # 저장소 Settings → Variables에 넣으면 적용돼요 (비워두면 기본값)
          PUBLISH_TIMES: ${{ vars.PUBLISH_TIMES }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}
        run: python -m blog_auto.main

      - name: 결과물 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts
          git diff --cached --quiet && exit 0
          git commit -m "블로그 초안: $(TZ=Asia/Seoul date +%Y-%m-%d)"
          # 실행 중에 저장소가 바뀌었어도 저장되도록 최신 내용을 받아온 뒤 올림
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
