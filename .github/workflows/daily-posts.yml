name: 매일 블로그 초안 만들기

on:
  schedule:
    # 매일 한국 시간 오전 6시 7분 (UTC 21:07)
    - cron: "7 21 * * *"
  workflow_dispatch: # Actions 탭에서 'Run workflow' 버튼으로 바로 실행

permissions:
  contents: write

concurrency:
  group: daily-posts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 글꼴 설치
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 주제 선정, 초안 작성, 썸네일 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # 저장소 Settings → Variables에 넣으면 적용돼요 (비워두면 기본값)
          POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY }}
          PUBLISH_TIMES: ${{ vars.PUBLISH_TIMES }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}
          DEDUPE_DAYS: ${{ vars.DEDUPE_DAYS }}
          THUMB_IMAGE_OPACITY: ${{ vars.THUMB_IMAGE_OPACITY }}
        run: python -m blog_auto.main

      - name: 결과물 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts
          git diff --cached --quiet && exit 0
          git commit -m "블로그 초안: $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
